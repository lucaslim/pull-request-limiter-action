# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-CA
reviews:
  profile: assertive
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!yarn.lock"
  path_instructions:
    - path: "src/**/*.js"
      instructions: >-
        Runs as a GitHub Action on every PR in consuming repos. Flag anything
        that could miscount open PRs, block a hotfix, or leak the token.
