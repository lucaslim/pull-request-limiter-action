name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # A job-level `if:` would skip the job, which reports green.
      - name: Require main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Releases must be dispatched from main, not ${GITHUB_REF}."
            exit 1
          fi
      - name: Validate version
        run: |
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must match X.Y.Z, got: ${VERSION}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn lint
      - run: yarn build
      - name: Fail if the tag exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists."
            exit 1
          fi
      # The bundle is committed only on a release commit that no branch contains.
      - name: Commit the bundle and tag
        run: |
          git checkout --detach
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/
          git commit -m "Release ${VERSION}"
          git tag "${VERSION}"
          git tag -f "v${VERSION%%.*}"
      - name: Push tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${VERSION}" "+v${VERSION%%.*}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${VERSION}" --verify-tag --generate-notes
